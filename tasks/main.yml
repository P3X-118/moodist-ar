---
- name: Perform Memcached installation tasks
  when: memcached_enabled | bool
  tags:
    - setup-all
    - setup-memcached
    - install-all
    - install-memcached
  block:
    - name: Validate Memcached configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install Memcached
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform Memcached uninstallation tasks
  when: not memcached_enabled | bool
  tags:
    - setup-all
    - setup-memcached
  block:
    - name: Uninstall Memcached
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
