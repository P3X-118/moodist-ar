---
- name: Ensure Moodist path exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "{{ moodist_uid }}"
    group: "{{ moodist_gid }}"
  with_items:
    - "{{ moodist_base_path }}"

- name: Ensure Moodist support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ moodist_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ moodist_uid }}"
    group: "{{ moodist_gid }}"
  with_items:
    - env
    - labels

- name: Run if self-building of Moodist container image is not enabled
  when: "not moodist_container_image_self_build | bool"
  block:
    - name: Ensure Moodist container image is pulled via community.docker.docker_image
      when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
      community.docker.docker_image:
        name: "{{ moodist_container_image }}"
        source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"
        force_source: "{{ moodist_container_image_force_pull if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
        force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else moodist_container_image_force_pull }}"
      register: result
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: result is not failed

    - name: Ensure Moodist container image is pulled via ansible.builtin.command
      when: devture_systemd_docker_base_container_image_pull_method == 'command'
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ moodist_container_image }}"
      register: result
      retries: "{{ devture_playbook_help_container_retries_count }}"
      delay: "{{ devture_playbook_help_container_retries_delay }}"
      until: result is not failed
      changed_when: "'Downloaded newer image' in result.stdout"

- name: Run if self-building of Moodist container image is enabled
  when: "moodist_container_image_self_build | bool"
  block:
    - name: Ensure Moodist repository is present on self-build
      ansible.builtin.git:
        repo: "{{ moodist_container_image_self_build_repo }}"
        version: "{{ moodist_container_image_self_build_repo_version }}"
        dest: "{{ moodist_container_image_self_build_src_files_path }}"
        force: "yes"
      register: moodist_git_pull_results

    - name: Ensure Moodist files for building container image installed
      ansible.builtin.template:
        src: "{{ role_path }}/templates/{{ item }}.j2"
        dest: "{{ moodist_container_image_self_build_src_files_path }}/{{ item }}"
        mode: "0640"
        owner: "{{ moodist_uid }}"
        group: "{{ moodist_gid }}"
        force: true # Overwrite the default Dockerfile at https://raw.githubusercontent.com/remvze/moodist/refs/heads/main/Dockerfile
      with_items:
        - .dockerignore
        - Dockerfile

    - name: Check if Moodist container image exists to avoid recreating the same one
      ansible.builtin.command: docker images -q "{{ moodist_container_image_self_build_name }}"
      register: moodist_docker_image_exists
      changed_when: false

    - name: Ensure Moodist container image is built if the container image does not exist or the repository has been updated
      community.docker.docker_image:
        name: "{{ moodist_container_image_self_build_name }}"
        source: build
        force_source: "{{ moodist_docker_image_exists.stdout == '' or (moodist_git_pull_results.before != moodist_git_pull_results.after) if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
        force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else moodist_docker_image_exists.stdout == '' or (moodist_git_pull_results.before != moodist_git_pull_results.after) }}"
        build:
          dockerfile: Dockerfile
          path: "{{ moodist_container_image_self_build_src_files_path }}"
          pull: true
          args:

- name: Ensure Moodist container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ moodist_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"

- name: Ensure Moodist container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ moodist_container_network }}
  register: network_creation_result
  changed_when: network_creation_result.rc == 0
  failed_when: network_creation_result.rc != 0 and 'already exists' not in network_creation_result.stderr

- name: Ensure Moodist systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/moodist.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ moodist_identifier }}.service"
    mode: "0644"
