---
- name: Check existence of Memcached systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ memcached_identifier }}.service"
  register: memcached_service_stat

- name: Uninstall Memcached systemd services and files
  when: memcached_service_stat.stat.exists | bool
  block:
    - name: Ensure Memcached systemd service is stopped
      ansible.builtin.service:
        name: "{{ memcached_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure Memcached systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ memcached_identifier }}.service"
        state: absent

    - name: Ensure Memcached container network does not exist via community.docker.docker_network
      when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
      community.docker.docker_network:
        name: "{{ memcached_container_network }}"
        state: absent

    - name: Ensure Memcached container network does not exist via ansible.builtin.command
      when: devture_systemd_docker_base_container_network_creation_method == 'command'
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} network rm
          {{ memcached_container_network }}
      register: network_deletion_result
      changed_when: memcached_container_network in network_deletion_result.stdout

    - name: Ensure Memcached path does not exist
      ansible.builtin.file:
        path: "{{ memcached_base_path }}"
        state: absent
