---
# Project source code URL: https://github.com/remvze/moodist

moodist_enabled: true

moodist_identifier: moodist
moodist_base_path: "/{{ moodist_identifier }}"

# renovate: datasource=docker depName=ghcr.io/remvze/moodist
moodist_version: v2.4.0

# The default Docker image requires root user
moodist_uid: "{{ '' if moodist_container_image_self_build else '0' }}"
moodist_gid: "{{ '' if moodist_container_image_self_build else '0' }}"

# The hostname at which Moodist is served.
moodist_hostname: ""

moodist_path_prefix: /

moodist_container_image: "{{ moodist_container_image_registry_prefix }}remvze/moodist:{{ moodist_container_image_tag }}"
moodist_container_image_tag: "{{ moodist_version }}"
moodist_container_image_registry_prefix: "{{ moodist_container_image_registry_prefix_upstream }}"
moodist_container_image_registry_prefix_upstream: "{{ moodist_container_image_registry_prefix_upstream_default }}"
moodist_container_image_registry_prefix_upstream_default: ghcr.io/
moodist_container_image_force_pull: "{{ moodist_container_image.endswith(':latest') }}"

moodist_container_image_self_build: true
moodist_container_image_self_build_name: "remvze/moodist-nonroot:{{ moodist_container_image_self_build_repo_version }}"
moodist_container_image_self_build_repo: "https://github.com/remvze/moodist.git"
moodist_container_image_self_build_repo_version: "{{ moodist_version if moodist_version != 'latest' else 'main' }}"
moodist_container_image_self_build_src_files_path: "{{ moodist_base_path }}/docker-src"

# Controls whether the Moodist container exposes its HTTP port (as defined by `moodist_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:8731"), or empty string to not expose.
moodist_container_http_host_bind_port: ""

# The base container network. It will be auto-created by this role if it doesn't exist already.
moodist_container_network: '{{ moodist_identifier }}'

# The port number in the container
moodist_container_http_port: 8080

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to a reverse proxy, which runs in a different container network.
moodist_container_additional_networks: "{{ moodist_container_additional_networks_auto + moodist_container_additional_networks_custom }}"
moodist_container_additional_networks_auto: []
moodist_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
moodist_container_additional_volumes: "{{ moodist_container_additional_volumes_auto + moodist_container_additional_volumes_custom }}"
moodist_container_additional_volumes_auto: []
moodist_container_additional_volumes_custom: []

# moodist_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `moodist_container_labels_additional_labels`.
moodist_container_labels_traefik_enabled: true
moodist_container_labels_traefik_docker_network: "{{ moodist_container_network }}"
moodist_container_labels_traefik_hostname: "{{ moodist_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/moodist`).
moodist_container_labels_traefik_path_prefix: "{{ moodist_path_prefix }}"
moodist_container_labels_traefik_rule: "Host(`{{ moodist_container_labels_traefik_hostname }}`){% if moodist_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ moodist_container_labels_traefik_path_prefix }}`){% endif %}"
moodist_container_labels_traefik_priority: 0
moodist_container_labels_traefik_entrypoints: web-secure
moodist_container_labels_traefik_tls: "{{ moodist_container_labels_traefik_entrypoints != 'web' }}"
moodist_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `moodist_container_labels_traefik_additional_request_headers_custom`
moodist_container_labels_traefik_additional_request_headers: "{{ moodist_container_labels_traefik_additional_request_headers_auto | combine(moodist_container_labels_traefik_additional_request_headers_custom) }}"
moodist_container_labels_traefik_additional_request_headers_auto: {}
moodist_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `moodist_container_labels_traefik_additional_response_headers_custom`
moodist_container_labels_traefik_additional_response_headers: "{{ moodist_container_labels_traefik_additional_response_headers_auto | combine(moodist_container_labels_traefik_additional_response_headers_custom) }}"
moodist_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': moodist_http_header_xss_protection} if moodist_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': moodist_http_header_content_type_options} if moodist_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': moodist_http_header_content_security_policy} if moodist_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': moodist_http_header_permissions_policy} if moodist_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': moodist_http_header_strict_transport_security} if moodist_http_header_strict_transport_security and moodist_container_labels_traefik_tls else {})
  }}
moodist_container_labels_traefik_additional_response_headers_custom: {}

# moodist_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `moodist_container_labels_additional_labels_custom`
#
# Example:
# moodist_container_labels_additional_labels_custom: |
#   my.label=1
#   another.label="here"
moodist_container_labels_additional_labels: "{{ moodist_container_labels_additional_labels_auto | combine(moodist_container_labels_additional_labels_custom) }}"
moodist_container_labels_additional_labels_auto: {}
moodist_container_labels_additional_labels_custom: {}

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
moodist_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
moodist_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
moodist_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
moodist_http_header_permissions_policy: "{{ 'interest-cohort=()' if moodist_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
moodist_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if moodist_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `moodist_http_header_permissions_policy`
moodist_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `moodist_http_header_strict_transport_security`
moodist_hsts_preload_enabled: false

# List of systemd services that the Moodist systemd service depends on
moodist_systemd_required_services_list: "{{ moodist_systemd_required_services_list_default + moodist_systemd_required_services_list_auto + moodist_systemd_required_services_list_custom }}"
moodist_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
moodist_systemd_required_services_list_auto: []
moodist_systemd_required_services_list_custom: []

# List of systemd services that the Moodist systemd service wants
moodist_systemd_wanted_services_list: "{{ moodist_systemd_wanted_services_list_default + moodist_systemd_wanted_services_list_auto + moodist_systemd_wanted_services_list_custom }}"
moodist_systemd_wanted_services_list_default: []
moodist_systemd_wanted_services_list_auto: []
moodist_systemd_wanted_services_list_custom: []

# Specify the timezone
moodist_environment_variables_tz: UTC

moodist_environment_variables_server_log_level: info

moodist_environment_variables_server_root: /public

# Additional environment variables.
moodist_environment_variables_additional_variables: ""
