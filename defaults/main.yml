---
# Project source code URL: https://github.com/memcached/memcached/

memcached_enabled: true

memcached_identifier: memcached
memcached_base_path: "/{{ memcached_identifier }}"

# Note: Change "memcached_container_image_self_build_dockerfile" when updating
# renovate: datasource=docker depName=memcached versioning=semver
memcached_version: 1.6.39

memcached_uid: ""
memcached_gid: ""

# The hostname at which Memcached is served.
memcached_hostname: ""

memcached_path_prefix: /

memcached_container_image: "{{ memcached_container_image_registry_prefix }}memcached:{{ memcached_container_image_tag }}"
memcached_container_image_tag: "{{ memcached_version }}"
memcached_container_image_registry_prefix: "{{ memcached_container_image_registry_prefix_upstream }}"
memcached_container_image_registry_prefix_upstream: "{{ memcached_container_image_registry_prefix_upstream_default }}"
memcached_container_image_registry_prefix_upstream_default: docker.io/
memcached_container_image_force_pull: "{{ memcached_container_image.endswith(':latest') }}"

memcached_container_image_self_build: false
memcached_container_image_self_build_name: "docker-library/memcached:{{ memcached_container_image_self_build_repo_version }}"
memcached_container_image_self_build_repo: "https://github.com/docker-library/memcached.git"
memcached_container_image_self_build_repo_version: "master"
memcached_container_image_self_build_dockerfile: "1/debian/Dockerfile"
memcached_container_image_self_build_src_files_path: "{{ memcached_base_path }}/docker-src"

# Controls whether the Memcached container exposes its HTTP port (as defined by `memcached_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:8731"), or empty string to not expose.
memcached_container_http_host_bind_port: ""

# The base container network. It will be auto-created by this role if it doesn't exist already.
memcached_container_network: '{{ memcached_identifier }}'

# The port number in the container
memcached_container_http_port: 11211

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to a reverse proxy, which runs in a different container network.
memcached_container_additional_networks: "{{ memcached_container_additional_networks_auto + memcached_container_additional_networks_custom }}"
memcached_container_additional_networks_auto: []
memcached_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
memcached_container_additional_volumes: "{{ memcached_container_additional_volumes_auto + memcached_container_additional_volumes_custom }}"
memcached_container_additional_volumes_auto: []
memcached_container_additional_volumes_custom: []

# memcached_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `memcached_container_labels_additional_labels`.
memcached_container_labels_traefik_enabled: false
memcached_container_labels_traefik_docker_network: "{{ memcached_container_network }}"
memcached_container_labels_traefik_hostname: "{{ memcached_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/memcached`).
memcached_container_labels_traefik_path_prefix: "{{ memcached_path_prefix }}"
memcached_container_labels_traefik_rule: "Host(`{{ memcached_container_labels_traefik_hostname }}`){% if memcached_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ memcached_container_labels_traefik_path_prefix }}`){% endif %}"
memcached_container_labels_traefik_priority: 0
memcached_container_labels_traefik_entrypoints: web-secure
memcached_container_labels_traefik_tls: "{{ memcached_container_labels_traefik_entrypoints != 'web' }}"
memcached_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `memcached_container_labels_traefik_additional_request_headers_custom`
memcached_container_labels_traefik_additional_request_headers: "{{ memcached_container_labels_traefik_additional_request_headers_auto | combine(memcached_container_labels_traefik_additional_request_headers_custom) }}"
memcached_container_labels_traefik_additional_request_headers_auto: {}
memcached_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `memcached_container_labels_traefik_additional_response_headers_custom`
memcached_container_labels_traefik_additional_response_headers: "{{ memcached_container_labels_traefik_additional_response_headers_auto | combine(memcached_container_labels_traefik_additional_response_headers_custom) }}"
memcached_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': memcached_http_header_xss_protection} if memcached_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': memcached_http_header_content_type_options} if memcached_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': memcached_http_header_content_security_policy} if memcached_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': memcached_http_header_permissions_policy} if memcached_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': memcached_http_header_strict_transport_security} if memcached_http_header_strict_transport_security and memcached_container_labels_traefik_tls else {})
  }}
memcached_container_labels_traefik_additional_response_headers_custom: {}

# memcached_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
#
# Example:
# memcached_container_labels_additional_labels: |
#   my.label=1
#   another.label="here"
memcached_container_labels_additional_labels: ""

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
memcached_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
memcached_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
memcached_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
memcached_http_header_permissions_policy: "{{ 'interest-cohort=()' if memcached_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
memcached_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if memcached_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `memcached_http_header_permissions_policy`
memcached_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `memcached_http_header_strict_transport_security`
memcached_hsts_preload_enabled: false

# List of systemd services that the Memcached systemd service depends on
memcached_systemd_required_services_list: "{{ memcached_systemd_required_services_list_default + memcached_systemd_required_services_list_auto + memcached_systemd_required_services_list_custom }}"
memcached_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
memcached_systemd_required_services_list_auto: []
memcached_systemd_required_services_list_custom: []

# List of systemd services that the Memcached systemd service wants
memcached_systemd_wanted_services_list: "{{ memcached_systemd_wanted_services_list_default + memcached_systemd_wanted_services_list_auto + memcached_systemd_wanted_services_list_custom }}"
memcached_systemd_wanted_services_list_default: []
memcached_systemd_wanted_services_list_auto: []
memcached_systemd_wanted_services_list_custom: []

# Additional environment variables.
memcached_environment_variables_additional_variables: ""
